services:
  db:
    image: postgres:18-alpine
    container_name: go_book_api_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: go_book_api_app
    restart: always
    ports:
      - "8040:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: