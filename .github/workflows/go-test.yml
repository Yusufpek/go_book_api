name: Go Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'
      - name: Download Go modules
        run: go mod download
      - name: Install dependencies for CGO/SQLite
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Run tests
        run: CGO_ENABLED=1 go test ./... -v
